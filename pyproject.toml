[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-tui"
version = "0.9.0"
description = "Production-ready multi-agent CLI with unified memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "sqlite-utils>=3.37",
    "structlog>=24.0.0",
    "cattrs>=23.2.0",
    "pathspec>=0.12.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "anthropic>=0.21.0",
    "httpx>=0.27.0",
    # ── Code Intelligence ──────────────────────────────────────────────────────
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10.0",
    # ── Git ────────────────────────────────────────────────────────────────────
    "pygit2>=1.14.0",
    # ── Sandboxed Execution ────────────────────────────────────────────────────
    "e2b-code-interpreter>=2.6.0",
    # ── Messaging ─────────────────────────────────────────────────────────────
    "nats-py>=2.10.0",
    # ── Token counting ─────────────────────────────────────────────────────────
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-json-report>=1.5.0",
    "ruff>=0.3.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py311"
