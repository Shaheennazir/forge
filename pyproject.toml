[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-cli"
version = "0.1.0"
description = "Production-ready multi-agent CLI with unified memory"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "sqlite-utils>=3.37",
    "structlog>=24.0.0",
    "cattrs>=23.2.0",
    "pathspec>=0.12.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "anthropic>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py311"
